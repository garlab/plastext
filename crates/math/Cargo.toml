[package]
name = "plastext-math"
description = "TeX math parsing and layout (spec MD-3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# MiTeX conversion laid out by a reused Typst engine, for measuring that route.
typst-engine = ["dep:mitex", "dep:typst", "dep:typst-layout", "dep:typst-assets"]
spike = ["typst-engine", "dep:typst-as-lib", "dep:typst-svg"]
# Other pure-Rust engines, compared on the same KaTeX cases.
katex-rs = ["dep:katex-rs"]
latex-rust = ["dep:latex-rust"]

[dependencies]
katex-native.workspace = true
katex-rs = { version = "0.3.0", optional = true }
latex-rust = { version = "3.0.1", optional = true }
mitex = { version = "0.2.4", optional = true }
typst = { version = "0.15.1", optional = true }
typst-layout = { version = "0.15.1", optional = true }
typst-as-lib = { version = "0.17", default-features = false, optional = true }
typst-svg = { version = "0.15.1", optional = true }
typst-assets = { version = "0.15.1", features = ["fonts"], optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "spike"
required-features = ["spike"]

[[example]]
name = "typst_cost"
required-features = ["typst-engine"]

[[example]]
name = "engine_compare"
required-features = ["katex-rs", "latex-rust"]

# Built with at most one engine feature, to measure that engine's binary size.
[[example]]
name = "engine_size"

[lints]
workspace = true
