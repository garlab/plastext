[package]
name = "plastext-app"
description = "The plastext application: startup, windows, single-instance server and session restore (spec §7.3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["runtime-shaders"]
runtime-shaders = ["gpui/runtime_shaders"]
# Links the MiTeX + Typst math route to measure its cost in the app binary;
# PLASTEXT_MATH_PROBE=bundled|bundled-math|system lays out one formula and exits.
math-spike = ["dep:plastext-math", "plastext-math/typst-engine"]

[dependencies]
clap.workspace = true
futures.workspace = true
gpui.workspace = true
plastext-cli.workspace = true
plastext-editor.workspace = true
plastext-math = { workspace = true, optional = true }
plastext-platform.workspace = true
plastext-settings.workspace = true
plastext-ui.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
