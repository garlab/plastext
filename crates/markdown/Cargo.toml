[package]
name = "plastext-markdown"
description = "Streaming Markdown parsing, block model, layout model and source maps (spec §5.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false }
plastext-buffer.workspace = true
url = "2"
percent-encoding = "2"
# Keep source-offset behavior deliberate; see metadata's Unicode/CRLF tests.
saphyr-parser = "=0.2.2"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
toml_parser = "1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
