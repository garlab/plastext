[package]
name = "plastext-platform"
description = "OS integration behind traits: URL scheme, Trash, reveal, IPC and file associations (spec §3.3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
tempfile.workspace = true
async-channel = "2"
notify = "8.2"
sha2 = "0.10"
toml.workspace = true
plastext-assets.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
foreign-types = "0.5"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "tex_preview"
harness = false

[[test]]
name = "mermaid_preview"
harness = false
