[package]
name = "plastext-ui"
description = "GPUI views: workspace, sidebar, tree, tabs, splits, palette and banners (spec §4.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["runtime-shaders"]
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
futures.workspace = true
async-channel = "2"
gpui.workspace = true
nucleo.workspace = true
plastext-buffer.workspace = true
plastext-assets.workspace = true
image = { version = "0.25", default-features = false }
plastext-editor.workspace = true
plastext-markdown.workspace = true
plastext-project.workspace = true
plastext-search.workspace = true
plastext-settings.workspace = true
plastext-syntax.workspace = true

[lints]
workspace = true
