[package]
name = "plastext-git"
description = "Read-only repository model over gitoxide: status, log, blame, refs and compare (spec §5.7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gix = { version = "0.90", default-features = false, features = ["status", "parallel", "sha1", "sha256"] }
notify = "8.2"
async-channel = "2"

[dev-dependencies]
tempfile.workspace = true
